[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dpdp-auditor-api"
version = "0.1.0"
description = "FastAPI backend gateway and LangGraph compliance agents for DPDP 360° AI Compliance Auditor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "uvicorn[standard]>=0.34.0",
    "supabase>=2.12.0",
    "pyjwt>=2.10.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pypdf>=5.0.0",
    "playwright>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["apps/api/tests", "tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
